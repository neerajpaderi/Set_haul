[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SetHaul"
version = "0.1.0"
description = "AgentCore Runtime Application using LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "opentelemetry-instrumentation-langchain >= 0.59.0",
    "langgraph >= 1.0.2",
    "langchain >= 1.0.3",
    "bedrock-agentcore >= 1.8.0",
    "botocore[crt] >= 1.35.0",
    "langchain-google-genai >= 3.0.3",
    "google-genai >= 1.0.0, < 2.0.0",
    "redis>=5.0.0,<5.1.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.6.0",
    "langchain-core",
    "supabase",
    "pydantic",
    "langchain-openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
